version: '3.8'

services:
  connect-ngo:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=your_production_jwt_secret_here
    volumes:
      - ./backend/database.json:/app/database.json
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - connect-ngo
    restart: unless-stopped
